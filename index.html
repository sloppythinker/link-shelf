<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <meta name="theme-color" content="#5b5bd6">
  <title>リンク棚 - LinkShelf</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
</head>
<body>
  <header class="header">
    <button class="icon-btn menu-btn" id="menuBtn" aria-label="メニュー">
      <svg viewBox="0 0 24 24" width="22" height="22"><path d="M3 6h18M3 12h18M3 18h18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    </button>
    <a class="brand" href="./">
      <svg class="brand-icon" viewBox="0 0 64 64" width="26" height="26" aria-hidden="true">
        <rect x="6" y="10" width="52" height="44" rx="8" fill="#5b5bd6"/>
        <rect x="14" y="20" width="14" height="24" rx="3" fill="#fff" opacity=".95"/>
        <rect x="32" y="20" width="8" height="24" rx="3" fill="#fbbf24"/>
        <rect x="44" y="20" width="8" height="24" rx="3" fill="#34d399" transform="rotate(8 48 32)"/>
      </svg>
      <span>リンク棚</span>
    </a>
    <div class="search-wrap">
      <svg class="search-icon" viewBox="0 0 24 24" width="16" height="16"><circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"/><path d="m20 20-3.5-3.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      <input type="search" id="searchInput" placeholder="タイトル・URL・タグ・メモを検索" autocomplete="off">
    </div>
    <button class="btn primary add-btn" id="addLinkBtn">
      <svg viewBox="0 0 24 24" width="16" height="16"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
      <span>リンク追加</span>
    </button>
    <button class="btn ghost" id="editModeBtn">編集</button>
  </header>

  <div class="layout">
    <div class="sidebar-backdrop" id="sidebarBackdrop"></div>
    <aside class="sidebar" id="sidebar">
      <nav class="side-section">
        <h2 class="side-heading">フォルダ</h2>
        <ul class="folder-list" id="folderList"></ul>
        <button class="side-add" id="addFolderBtn">＋ 新規フォルダ</button>
      </nav>
      <nav class="side-section">
        <h2 class="side-heading">タグ</h2>
        <div class="tag-cloud" id="tagCloud"></div>
      </nav>
      <div class="side-footer">
        <button class="side-tool" id="exportBtn">エクスポート</button>
        <button class="side-tool" id="importBtn">インポート</button>
        <input type="file" id="importFile" accept="application/json,.json" hidden>
      </div>
    </aside>

    <main class="main">
      <div class="toolbar">
        <h1 class="current-view" id="currentView">すべてのリンク</h1>
        <span class="count-badge" id="countBadge">0件</span>
        <div class="active-tags" id="activeTags"></div>
      </div>
      <div class="card-grid" id="cardGrid"></div>
      <div class="empty-state" id="emptyState" hidden>
        <svg viewBox="0 0 64 64" width="72" height="72" aria-hidden="true">
          <rect x="6" y="10" width="52" height="44" rx="8" fill="#e6e6f5"/>
          <rect x="14" y="20" width="14" height="24" rx="3" fill="#fff"/>
          <rect x="32" y="20" width="8" height="24" rx="3" fill="#fff"/>
          <rect x="44" y="20" width="8" height="24" rx="3" fill="#fff" transform="rotate(8 48 32)"/>
        </svg>
        <p class="empty-title" id="emptyTitle">まだリンクがありません</p>
        <p class="empty-desc" id="emptyDesc">まずは「リンク追加」ボタンからサイトを登録しましょう。<br>フォルダ分けは後から、カードのフォルダボタンでできます。</p>
      </div>
    </main>
  </div>

  <!-- リンク追加/編集モーダル -->
  <div class="modal-backdrop" id="linkModal" hidden>
    <div class="modal" role="dialog" aria-modal="true">
      <h2 class="modal-title" id="linkModalTitle">リンクを追加</h2>
      <form id="linkForm">
        <label class="field">
          <span class="field-label">URL <em>必須</em></span>
          <input type="url" id="fieldUrl" placeholder="https://example.com" required>
        </label>
        <label class="field">
          <span class="field-label">タイトル</span>
          <input type="text" id="fieldTitle" placeholder="未入力の場合はURLを表示">
        </label>
        <label class="field">
          <span class="field-label">フォルダ（後からでも変更できます）</span>
          <select id="fieldFolder"></select>
          <input type="text" id="fieldNewFolder" placeholder="新しいフォルダ名を入力" hidden style="margin-top:6px;">
        </label>
        <div class="field">
          <span class="field-label">タグ</span>
          <div class="chip-input" id="chipInput">
            <input type="text" id="fieldTagText" placeholder="入力してEnterで追加" autocomplete="off">
          </div>
          <div class="tag-suggest" id="tagSuggest"></div>
        </div>
        <label class="field">
          <span class="field-label">メモ</span>
          <textarea id="fieldNote" rows="2" placeholder="任意"></textarea>
        </label>
        <div class="modal-actions">
          <button type="button" class="btn ghost" id="linkCancelBtn">キャンセル</button>
          <button type="submit" class="btn primary" id="linkSaveBtn">保存</button>
        </div>
      </form>
    </div>
  </div>

  <!-- フォルダ作成/リネームモーダル -->
  <div class="modal-backdrop" id="folderModal" hidden>
    <div class="modal small" role="dialog" aria-modal="true">
      <h2 class="modal-title" id="folderModalTitle">新規フォルダ</h2>
      <form id="folderForm">
        <label class="field">
          <span class="field-label">フォルダ名</span>
          <input type="text" id="fieldFolderName" placeholder="例: 制作ツール" required>
        </label>
        <div class="modal-actions">
          <button type="button" class="btn danger" id="folderDeleteBtn" hidden>削除</button>
          <span class="spacer"></span>
          <button type="button" class="btn ghost" id="folderCancelBtn">キャンセル</button>
          <button type="submit" class="btn primary">保存</button>
        </div>
      </form>
    </div>
  </div>

  <div class="popover" id="folderPicker" hidden></div>

  <div class="toast" id="toast" hidden></div>

  <script src="js/store.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
